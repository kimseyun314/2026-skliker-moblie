    <label><input type="radio" name="side" value="both" checked> 앞·뒤 모두</label>

    <label><input type="radio" name="side" value="back"> 뒷면만</label>

  <p class="tip">카드 크기 63×88mm (트레이딩카드 규격), A4 한 장에 9장. 인쇄 설정에서 <b>배율 100%</b>, <b>여백 없음</b>, <b>배경 그래픽 켜기</b>를 선택하세요.
    양면 인쇄는 <b>긴 쪽으로 넘기기</b>로 하면 앞뒤가 맞도록 뒷면 순서를 좌우로 뒤집어 두었어요.</p>
