<button id="scanBtn" class="scan-btn" hidden>카드 스캔</button>

  <div class="scan-k">SCAN YOUR CARD</div>
  <p class="scan-msg" id="scanMsg">선수카드 뒷면의 QR을 네모 안에 맞춰주세요</p>
  <button class="scan-close" id="scanClose">닫기</button>
</div>
